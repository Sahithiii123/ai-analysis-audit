[project]
name = "ai-analysis-audit"
version = "0.1.0"
description = "Reproducible audits of AI-generated analyses on public datasets"
requires-python = ">=3.11,<3.15"
dependencies = [
    "duckdb==1.4.2",
    "ipykernel==7.4.0",
    "jsonschema==4.26.0",
    "matplotlib==3.10.7",
    "nbconvert==7.16.6",
    "numpy==2.3.4",
    "pandas==2.3.3",
    "python-dotenv==1.2.1",
    "requests==2.32.5",
    "scikit-learn==1.7.2",
    "scipy==1.16.3",
    "seaborn==0.13.2",
    "statsmodels==0.14.5",
    "ucimlrepo==0.0.7",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]